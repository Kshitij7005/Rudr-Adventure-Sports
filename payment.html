<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Payment - Rudr Adventure</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
body{
    font-family:Arial;
    text-align:center;
    padding:30px;
    background:#f5f5f5;
}

.card{
    max-width:600px;
    margin:auto;
    padding:20px;
    border-radius:15px;
}

#qrcode{
    margin:20px auto;
}

.btn-pay{
    width:100%;
    margin:8px 0;
}
</style>
</head>

<body>

<div class="card shadow">

<h2>Complete Your Payment</h2>

<h3 id="amountText">₹0</h3>

<div id="qrcode"></div>

<!-- UPI ID -->
<p><b>UPI ID:</b> <span id="upiText"></span></p>

<button class="btn btn-success btn-pay" onclick="openUPI()">
Pay with Google Pay
</button>

<button class="btn btn-primary btn-pay" onclick="openUPI()">
Pay with PhonePe
</button>

<button class="btn btn-dark btn-pay" onclick="openUPI()">
Pay with Paytm
</button>

<hr>

<h5>Manual UPI</h5>
<button class="btn btn-outline-secondary btn-sm" onclick="copyUPI()">
Copy UPI ID
</button>
<hr>

<p class="text-danger fw-bold mt-3">
After payment, take a screenshot and send it on WhatsApp for booking confirmation.
</p>

<button class="btn btn-success btn-pay" onclick="sendScreenshot()">
Send Screenshot on WhatsApp
</button>

</div>

<script>

// ================= CONFIG =================
const CONFIG = {
    upiID: "Q068386495@ybl",
    name: "Rudr Adventure"
};

// ================= GET DATA =================
let params = new URLSearchParams(window.location.search);
let amount = Number(params.get("amount")) || 0;

document.getElementById("amountText").innerText = "₹" + amount;
document.getElementById("upiText").innerText = CONFIG.upiID;

// ================= QR CODE =================
let upiString =
    "upi://pay?pa=" + CONFIG.upiID +
    "&pn=" + CONFIG.name +
    "&am=" + amount +
    "&cu=INR";

new QRCode(document.getElementById("qrcode"), {
    text: upiString,
    width: 200,
    height: 200
});

// ================= OPEN UPI =================
function openUPI(){

    let url =
        "upi://pay?pa=" + CONFIG.upiID +
        "&pn=" + CONFIG.name +
        "&am=" + amount +
        "&cu=INR";

    window.location.href = url;

    setTimeout(() => {
        window.open(url, "_blank");
    }, 500);
}

// ================= COPY UPI =================
function copyUPI(){
    navigator.clipboard.writeText(CONFIG.upiID);
    alert("UPI ID copied!");
}
function sendScreenshot(){

    let params = new URLSearchParams(window.location.search);

    let bookingId =
        "RA-" +
        Math.floor(1000 + Math.random() * 9000) +
        "-" +
        Date.now().toString().slice(-4);

    let name = params.get("name") || "";
    let phone = params.get("phone") || "";
    let date = params.get("date") || "";
    let persons = params.get("persons") || "";
    let activity = params.get("activity") || "";

    let whatsappMsg =
`🎉 New Booking Request

Booking ID: ${bookingId}

Name: ${name}
Phone: ${phone}
Date: ${date}
Persons: ${persons}
Activity: ${activity}

📸 Please attach payment screenshot before sending.`;

    let waUrl =
    "https://wa.me/918091757971?text=" +
    encodeURIComponent(whatsappMsg);

    window.open(waUrl, "_blank");
}
</script>

</body>
</html>
